name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The built CLI on the test feed, the way a user runs it.
      - run: node dist/bin.js plan --gtfs tests/fixtures/mini --from Alpha --to Delta --date 2026-11-10 --time 08:00

  # This workflow checked by workflow-guard (https://github.com/Gallileee/workflow-guard).
  workflow-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: Gallileee/workflow-guard@a16822661831a0cfef65ffb805000dd9a592e66e  # v0.14.0
